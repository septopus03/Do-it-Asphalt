<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B Hazard Signage: HUD</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #2b2c2f; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; color: #ffffff; text-transform: uppercase; letter-spacing: 0.04em">
<svg aria-hidden="true" viewBox="0 0 1920 1080" preserveAspectRatio="none" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px">
<rect width="1920" height="470" fill="#465867"></rect>
<rect y="350" width="1920" height="120" fill="#566978"></rect>
<rect x="1180" y="356" width="560" height="114" fill="#35414b"></rect>
<rect x="240" y="296" width="72" height="174" fill="#35414b"></rect>
<rect x="322" y="380" width="170" height="90" fill="#35414b"></rect>
<rect y="470" width="1920" height="610" fill="#6c675d"></rect>
<polygon points="960,470 1330,470 1920,800 1920,1080 280,1080" fill="#2b2c2f"></polygon>
<polygon points="960,470 1004,470 800,1080 280,1080" fill="#151618"></polygon>
<g style="stroke: rgba(255,255,255,0.07); stroke-width: 2px">
<line x1="960" y1="470" x2="-700" y2="1080"></line>
<line x1="960" y1="470" x2="1320" y2="1080"></line>
<line x1="960" y1="470" x2="1880" y2="1080"></line>
<line x1="960" y1="470" x2="2700" y2="1080"></line>
<line x1="0" y1="510" x2="1920" y2="510"></line>
<line x1="0" y1="580" x2="1920" y2="580"></line>
<line x1="0" y1="700" x2="1920" y2="700"></line>
<line x1="0" y1="880" x2="1920" y2="880"></line>
</g>
</svg>

<div style="position: absolute; left: 28px; top: 28px; display: flex; align-items: baseline; gap: 12px; padding: 8px 24px 10px 24px; background: #FFC61A; color: #111214; border: 3px solid #FFC61A; box-shadow: inset 0 0 0 3px #111214; border-radius: 6px">
<div style="font-size: 62px; font-weight: 800; line-height: 1">9,450</div>
<div style="font-size: 23px; letter-spacing: 0.12em">Credits</div>
</div>

<div style="position: absolute; right: 28px; top: 28px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding: 12px 22px 16px 22px; background: #111214; border: 3px solid #111214; box-shadow: inset 0 0 0 3px #FFC61A; border-radius: 6px">
<div style="font-size: 44px; font-weight: 800; line-height: 1.1">6,412 / 30,000 · 21%</div>
<div style="font-size: 21px; letter-spacing: 0.14em; color: #FFC61A">Cells paved</div>
<div style="width: 440px; height: 18px; box-sizing: border-box; border: 2px solid #FFC61A; background: repeating-linear-gradient(-45deg, #4a3f14 0px, #4a3f14 8px, #111214 8px, #111214 16px)">
<div style="width: 21%; height: 14px; background: #FFC61A"></div>
</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 6px">
<div style="background: #FFC61A; color: #111214; font-size: 19px; font-weight: 800; padding: 0 8px; letter-spacing: 0.1em">Next</div>
<div style="font-size: 22px">Exit – entry 6 / 12, cells 6,412 / 30,000</div>
</div>
<div style="font-size: 22px">Paver: sector 12 · 143 / 400</div>
</div>

<div style="position: absolute; left: 0; right: 0; top: 110px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="padding: 6px 22px 8px 22px; background: #FFC61A; color: #111214; border: 3px solid #FFC61A; box-shadow: inset 0 0 0 3px #111214; border-radius: 6px; font-size: 32px; font-weight: 800">+30 credits</div>
<div style="padding: 6px 22px 8px 22px; background: #FFC61A; color: #111214; border: 3px solid #FFC61A; box-shadow: inset 0 0 0 3px #111214; border-radius: 6px; font-size: 32px; font-weight: 800">Entry 6 complete</div>
</div>

<div style="position: absolute; left: 0; right: 0; top: 268px; display: flex; justify-content: center; align-items: center; gap: 30px">
<div style="width: 74px; height: 74px; transform: rotate(45deg); background: #FF7A1A; border: 3px solid #FF7A1A; box-shadow: inset 0 0 0 4px #111214; border-radius: 6px; display: flex; align-items: center; justify-content: center">
<svg role="img" aria-label="Direction to the nearest unfinished cell" viewBox="0 0 48 48" style="width: 46px; height: 46px; transform: rotate(-10deg)">
<path d="M24 4 L40 25 H30 V44 H18 V25 H8 Z" fill="#111214"></path>
</svg>
</div>
<div style="padding: 6px 22px 8px 22px; background: #111214; color: #FF9A4D; border: 3px solid #111214; box-shadow: inset 0 0 0 3px #FF7A1A; border-radius: 6px; font-size: 32px">Nearest unfinished: 42 m</div>
</div>

<div style="position: absolute; left: 955px; top: 535px; width: 10px; height: 10px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 0 3px rgba(0,0,0,0.6)"></div>

<div style="position: absolute; left: 0; right: 0; bottom: 26px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="display: flex; align-items: baseline; gap: 14px; padding: 6px 22px 8px 22px; background: #111214; border: 3px solid #111214; box-shadow: inset 0 0 0 3px #FFC61A; border-radius: 6px">
<div style="font-size: 21px; letter-spacing: 0.14em; color: #FFC61A">Plant stock</div>
<div style="font-size: 30px">4,640 / 8,000 l</div>
</div>
<div style="display: flex; align-items: stretch; gap: 8px">
<div style="width: 58px; display: flex; align-items: center; justify-content: center; background: #FFC61A; color: #111214; border: 3px solid #FFC61A; box-shadow: inset 0 0 0 3px #111214; border-radius: 6px; font-size: 34px; font-weight: 800">E</div>
<div style="padding: 6px 24px 8px 24px; background: #111214; border: 3px solid #111214; box-shadow: inset 0 0 0 3px #FFC61A; border-radius: 6px; font-size: 34px">Push</div>
</div>
<div style="display: flex; align-items: baseline; gap: 14px; padding: 4px 22px 6px 22px; background: #111214; border: 3px solid #111214; box-shadow: inset 0 0 0 3px #FFC61A; border-radius: 6px">
<div style="font-size: 27px; font-weight: 800">Bucket</div>
<div style="font-size: 27px; color: #FFC61A">6.4 / 10 l</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 10px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
<div style="width: 140px; height: 94px; box-sizing: border-box; padding: 9px 12px 12px 12px; display: flex; flex-direction: column; justify-content: space-between; background: {{s.bg}}; color: {{s.fg}}; border: 3px solid {{s.bg}}; box-shadow: inset 0 0 0 3px {{s.fg2}}; border-radius: 6px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; background: {{s.fg2}}; color: {{s.bg}}; font-size: 20px; font-weight: 800; letter-spacing: 0">{{s.key}}</div>
<div style="font-size: 29px; font-weight: 800; line-height: 1">{{s.name}}</div>
</div>
<div style="height: 9px; margin: 0 2px; background: {{s.track}}; visibility: {{s.gauge}}">
<div style="height: 9px; width: {{s.fill}}; background: {{s.fg2}}"></div>
</div>
</div>
</sc-for>
</div>
<div style="height: 12px; background: repeating-linear-gradient(-45deg, #FFC61A 0px, #FFC61A 12px, #111214 12px, #111214 24px)"></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
var slot = function (key, name, fill, gauge, on) {
return {
key: key, name: name, fill: fill, gauge: gauge,
bg: on ? '#FFC61A' : '#111214',
fg: on ? '#111214' : '#ffffff',
fg2: on ? '#111214' : '#FFC61A',
track: on ? 'rgba(17,18,20,0.25)' : 'rgba(255,255,255,0.22)'
};
};
return {
slots: [
slot('1', 'Bowl', '100%', 'visible', false),
slot('2', 'Scoop', '0%', 'visible', false),
slot('3', 'Bucket', '64%', 'visible', true),
slot('4', 'Trowel', '0%', 'hidden', false)
]
};
}
}
</script>
</body>
</html>
