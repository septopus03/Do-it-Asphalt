<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B Hazard Signage: Menu, settings, win</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #2b2c2f; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; color: #111214; text-transform: uppercase; letter-spacing: 0.04em">
<svg aria-hidden="true" viewBox="0 0 1920 1080" preserveAspectRatio="none" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px">
<rect width="1920" height="470" fill="#465867"></rect>
<rect y="350" width="1920" height="120" fill="#566978"></rect>
<rect x="1180" y="356" width="560" height="114" fill="#35414b"></rect>
<rect y="470" width="1920" height="610" fill="#6c675d"></rect>
<polygon points="960,470 1330,470 1920,800 1920,1080 280,1080" fill="#2b2c2f"></polygon>
<polygon points="960,470 1004,470 800,1080 280,1080" fill="#151618"></polygon>
</svg>
<div style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: rgba(0,0,0,0.6)"></div>

<div style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; justify-items: center">

<div style="width: 440px; box-sizing: border-box; background: #FFC61A; border: 4px solid #FFC61A; box-shadow: inset 0 0 0 4px #111214; border-radius: 8px; padding: 34px 44px 44px 44px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 80px; font-weight: 800; line-height: 1; text-align: center; margin-bottom: 12px">Paused</div>
<button style="height: 64px; border: 0; border-radius: 4px; background: #111214; color: #FFC61A; font-family: inherit; font-size: 32px; font-weight: 800; letter-spacing: 0.1em; cursor: pointer">RESUME</button>
<button style="height: 64px; border: 0; border-radius: 4px; background: #111214; color: #ffffff; font-family: inherit; font-size: 32px; font-weight: 800; letter-spacing: 0.1em; cursor: pointer">NEW GAME</button>
<button style="height: 64px; border: 0; border-radius: 4px; background: #111214; color: #ffffff; font-family: inherit; font-size: 32px; font-weight: 800; letter-spacing: 0.1em; cursor: pointer">SETTINGS</button>
<button style="height: 64px; border: 0; border-radius: 4px; background: #111214; color: #ffffff; font-family: inherit; font-size: 32px; font-weight: 800; letter-spacing: 0.1em; cursor: pointer">QUIT</button>
</div>

<div style="width: 440px; box-sizing: border-box; background: #FFC61A; border: 4px solid #FFC61A; box-shadow: inset 0 0 0 4px #111214; border-radius: 8px; padding: 34px 44px 44px 44px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 80px; font-weight: 800; line-height: 1; text-align: center; margin-bottom: 12px">Settings</div>
<div style="display: flex; align-items: baseline; justify-content: space-between">
<label for="b-sens" style="font-size: 26px; letter-spacing: 0.08em">Mouse sensitivity</label>
<div style="font-size: 40px; font-weight: 800">1.00</div>
</div>
<input id="b-sens" type="range" min="0.1" max="3" step="0.05" value="1" style="width: 100%; height: 44px; margin: 0; accent-color: #111214">
<button style="height: 64px; border: 0; border-radius: 4px; background: #111214; color: #ffffff; font-family: inherit; font-size: 32px; font-weight: 800; letter-spacing: 0.1em; cursor: pointer; margin-top: 10px">BACK</button>
</div>

<div style="width: 560px; box-sizing: border-box; background: #FFC61A; border: 4px solid #FFC61A; box-shadow: inset 0 0 0 4px #111214; border-radius: 8px; padding: 12px 12px 44px 12px; display: flex; flex-direction: column">
<div style="height: 20px; background: repeating-linear-gradient(-45deg, #111214 0px, #111214 16px, #FFC61A 16px, #FFC61A 32px)"></div>
<div style="font-size: 64px; font-weight: 800; line-height: 1; text-align: center; margin: 26px 0 18px 0">Parking lot complete!</div>
<div style="display: flex; flex-direction: column; padding: 0 32px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="5">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 9px 0; border-top: 3px solid #111214">
<div style="font-size: 26px; letter-spacing: 0.08em">{{s.label}}</div>
<div style="font-size: 34px; font-weight: 800">{{s.value}}</div>
</div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 14px 32px 0 32px; padding-top: 20px; border-top: 3px solid #111214">
<button style="height: 64px; border: 0; border-radius: 4px; background: #111214; color: #FFC61A; font-family: inherit; font-size: 30px; font-weight: 800; letter-spacing: 0.1em; cursor: pointer">NEW GAME</button>
<button style="height: 64px; border: 0; border-radius: 4px; background: #111214; color: #ffffff; font-family: inherit; font-size: 30px; font-weight: 800; letter-spacing: 0.1em; cursor: pointer">QUIT</button>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
return {
stats: [
{ label: 'Time', value: '3:42:10' },
{ label: 'Cells paved', value: '30,000' },
{ label: 'Asphalt poured', value: '301,224 l' },
{ label: 'Credits earned', value: '300,000' },
{ label: 'Items bought', value: '16 / 16' }
]
};
}
}
</script>
</body>
</html>
